govaccess:
  ai:
    enabled: true
    # Profiles can replace this ordered list. Keep each provider's connection settings in environment variables.
    providers:
      - name: primary
        base-url: ${AI_BASE_URL:}
        api-key: ${AI_API_KEY:}
        model: ${AI_MODEL:}
        hosted: ${AI_HOSTED:true}
    prompts:
      policy-interpretation: 2
      provider-probe: 1
    cache-mode: OFF
    redaction-mode: BLOCK
    kill-switch: false
