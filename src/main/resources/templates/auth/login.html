<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · GovAccess AI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/mazer/icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/vendor/mazer/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/app.css(v='20261127-lighter-buttons')}">
</head>
<body class="login-page">
    <main class="login-panel">
        <div class="site-name">
            <span class="brand-mark"><i class="bi-shield-check" aria-hidden="true"></i></span>
            <span>GovAccess <span class="brand-ai">AI</span></span>
        </div>
        <div class="login-form">
            <h1>Sign in</h1>
            <p>Use your account to access the officer workspace.</p>
            <p class="alert alert-danger" role="alert" th:if="${param.error}">The username or password is incorrect.</p>
            <p class="alert alert-warning" role="alert" th:if="${param.expired}">Your sign-in form expired. Enter your credentials again.</p>
            <p class="alert alert-success" role="status" th:if="${param.logout}">You have signed out.</p>
            <form th:action="@{/login}" method="post">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" name="password"
                       autocomplete="current-password" required>
                <button class="btn btn-primary w-100" type="submit">Sign in</button>
            </form>
        </div>
    </main>
</body>
</html>
