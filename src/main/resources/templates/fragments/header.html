<header id="sidebar" class="active" xmlns:th="http://www.thymeleaf.org" th:fragment="siteHeader">
    <div class="sidebar-wrapper">
        <div class="sidebar-header">
            <a class="site-name" href="/" th:href="@{/}">
                <span class="brand-mark"><i class="bi-shield-check" aria-hidden="true"></i></span>
                <span>GovAccess <span class="brand-ai">AI</span></span>
            </a>
            <button class="btn btn-outline-primary navigation-toggle" type="button" hidden
                    aria-controls="primary-navigation" aria-expanded="false">
                <i class="bi-list" aria-hidden="true"></i> Menu
            </button>
        </div>
        <nav class="sidebar-menu" id="primary-navigation" aria-label="Primary">
            <ul class="menu">
                <li class="sidebar-title">Workspace</li>
                <li class="sidebar-item active">
                    <a class="sidebar-link" href="/" th:href="@{/}"
                       aria-current="page">
                        <i class="bi-grid-fill" aria-hidden="true"></i>
                        <span>Overview</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" href="#policy-versions">
                        <i class="bi-file-earmark-text" aria-hidden="true"></i>
                        <span>Policy versions</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" th:href="@{/actuator/health}">
                        <i class="bi-speedometer2" aria-hidden="true"></i>
                        <span>System status</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
