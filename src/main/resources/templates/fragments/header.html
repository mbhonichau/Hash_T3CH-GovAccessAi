<header id="sidebar" class="active" xmlns:th="http://www.thymeleaf.org" th:fragment="siteHeader(title)">
    <div class="sidebar-wrapper">
        <div class="sidebar-header">
            <a class="site-name" href="/" th:href="@{/}">GovAccess AI</a>
            <button class="btn btn-outline-primary navigation-toggle" type="button" hidden
                    aria-controls="primary-navigation" aria-expanded="false">
                <i class="bi-list" aria-hidden="true"></i> Menu
            </button>
        </div>
        <nav class="sidebar-menu" id="primary-navigation" aria-label="Primary">
            <ul class="menu">
                <li class="sidebar-item" th:classappend="${title == 'GovAccess AI' ? 'active' : ''}">
                    <a class="sidebar-link" href="/" th:href="@{/}"
                       th:attr="aria-current=${title == 'GovAccess AI' ? 'page' : null}">
                        <i class="bi-grid-fill" aria-hidden="true"></i>
                        <span>Overview</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
