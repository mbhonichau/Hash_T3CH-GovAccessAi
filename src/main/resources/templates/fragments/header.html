<header id="sidebar" class="active" xmlns:th="http://www.thymeleaf.org" th:fragment="siteHeader">
    <div class="sidebar-wrapper">
        <div class="sidebar-header">
            <a class="site-name" href="/" th:href="@{/}">
                <span class="brand-mark"><i class="bi-shield-check" aria-hidden="true"></i></span>
                <span>GovAccess <span class="brand-ai">AI</span></span>
            </a>
            <button class="btn btn-outline-primary navigation-toggle" type="button" hidden
                    aria-controls="primary-navigation" aria-expanded="false">
                <i class="bi-list" aria-hidden="true"></i> Menu
            </button>
        </div>
        <nav class="sidebar-menu" id="primary-navigation" aria-label="Primary">
            <ul class="menu">
                <li class="sidebar-title">Workspace</li>
                <li class="sidebar-item" th:classappend="${screen == null and workspaceAccessPage == null and cataloguePage == null and documentImportPage == null ? 'active' : null}">
                    <a class="sidebar-link" href="/" th:href="@{/}"
                       th:attr="aria-current=${screen == null and workspaceAccessPage == null and cataloguePage == null and documentImportPage == null ? 'page' : null}">
                        <i class="bi-grid-fill" aria-hidden="true"></i>
                        <span>Overview</span>
                    </a>
                </li>
                <li class="sidebar-item" th:classappend="${documentImportPage == true ? 'active' : null}">
                    <a class="sidebar-link" th:href="@{/policies/imports}"
                       th:attr="aria-current=${documentImportPage == true ? 'page' : null}">
                        <i class="bi-file-earmark-text" aria-hidden="true"></i>
                        <span>Policy imports</span>
                    </a>
                </li>
                <li class="sidebar-item" th:classappend="${cataloguePage == true ? 'active' : null}">
                    <a class="sidebar-link" th:href="@{/rules/catalogue}"
                       th:attr="aria-current=${cataloguePage == true ? 'page' : null}">
                        <i class="bi-list-check" aria-hidden="true"></i>
                        <span>Rule catalogue</span>
                    </a>
                </li>
                <li class="sidebar-item" th:classappend="${screen != null ? 'active' : null}">
                    <a class="sidebar-link" th:href="@{/policies/nsfas-2025}"
                       th:attr="aria-current=${screen != null ? 'page' : null}">
                        <i class="bi-file-earmark-text" aria-hidden="true"></i>
                        <span>Policy Studio</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" th:href="@{/actuator/health}">
                        <i class="bi-speedometer2" aria-hidden="true"></i>
                        <span>System status</span>
                    </a>
                </li>
                <li class="sidebar-item" th:classappend="${workspaceAccessPage == true ? 'active' : null}">
                    <a class="sidebar-link" th:href="@{/workspace/access}"
                       th:attr="aria-current=${workspaceAccessPage == true ? 'page' : null}">
                        <i class="bi-shield-check" aria-hidden="true"></i>
                        <span>Workspace access</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
