<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: page('GovAccess AI · Case messages and notices', ~{::#communications})}">
<body>
<section id="communications">
    <div class="overview-heading">
        <a class="btn btn-outline-primary app-nav-button mb-2" th:href="@{/applications/{id}(id=${applicationId})}">Back to application</a>
        <h1>Case messages and notices</h1>
    </div>
    <div class="d-flex flex-wrap gap-2 mb-3">
        <form method="post" th:if="${canRequestEvidence}" th:action="@{/applications/{id}/communications(id=${applicationId})}">
            <button class="btn btn-outline-primary" name="kind" value="EVIDENCE_REQUEST">Draft evidence request</button>
        </form>
        <form method="post" th:if="${canApproveNotice}" th:action="@{/applications/{id}/communications(id=${applicationId})}">
            <button class="btn btn-primary" name="kind" value="DECISION_NOTICE">Draft decision notice</button>
        </form>
    </div>
    <p th:if="${#lists.isEmpty(messages)}">No messages are available.</p>
    <ul class="list-group" th:unless="${#lists.isEmpty(messages)}">
        <li class="list-group-item" th:each="entry : ${messages}">
            <a class="btn btn-outline-primary app-nav-button btn-sm" th:href="@{/applications/{app}/communications/{entry}(app=${applicationId},entry=${entry.id})}"
               th:text="${entry.kind == 'DECISION_NOTICE' ? 'Decision notice' : 'Request for additional evidence'}"></a>
            <span th:text="${entry.state}"></span>
        </li>
    </ul>
</section>
</body>
</html>
