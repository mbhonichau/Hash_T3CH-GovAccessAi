<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title}">GovAccess AI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/mazer/icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/vendor/mazer/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/app.css(v='20261127-full-sita-glass-white')}">
    <script defer th:src="@{/js/navigation.js}"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app">
        <header th:replace="~{fragments/header :: siteHeader}"></header>
        <div id="main">
            <div class="workspace-bar">
                <span class="workspace-label"><i class="bi-grid" aria-hidden="true"></i> Officer workspace</span>
                <div class="workspace-account">
                    <span class="account-name"><i class="bi-person-circle" aria-hidden="true"></i>
                        <span th:text="${username}">User</span>
                    </span>
                    <form th:action="@{/logout}" method="post">
                        <button class="sign-out" type="submit">Sign out</button>
                    </form>
                </div>
            </div>
            <main id="main-content" tabindex="-1">
                <p class="alert alert-warning" role="status" th:if="${navHostedAi}">Hosted AI configured. Synthetic data only.</p>
                <div th:replace="~{fragments/alerts :: alerts}"></div>
                <th:block th:replace="${content}"></th:block>
            </main>
        </div>
    </div>
</body>
</html>
