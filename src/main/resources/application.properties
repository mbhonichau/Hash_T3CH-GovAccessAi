spring.application.name=govaccessai
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/govaccess}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.default-schema=govaccess
spring.flyway.locations=classpath:db/migration,classpath:za/gov/govaccess/rules/migration
spring.jpa.properties.hibernate.default_schema=govaccess

spring.profiles.active=supabase

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
