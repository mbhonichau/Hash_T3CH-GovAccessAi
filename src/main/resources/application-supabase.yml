# Supabase PostgreSQL via the IPv4 session pooler.
# Activate with --spring.profiles.active=supabase.
spring:
  datasource:
    url: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?user=postgres.dsexqqtwerhhilfkjkyn&password=[YOUR-DATABASE-PASSWORD]
    driver-class-name: org.postgresql.Driver
    username: postgres.dsexqqtwerhhilfkjkyn
    password: #T3ch!012345%hdc
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 600000
      pool-name: SupabaseHikariCP

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

logging:
  level:
    root: INFO
    com.hashtech.govaccessai: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
