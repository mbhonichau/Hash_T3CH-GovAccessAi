# Supabase PostgreSQL via the IPv4 session pooler.
# Activate with --spring.profiles.active=supabase.
spring:
  datasource:
    url: "${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://${SUPABASE_POOLER_HOST:aws-0-eu-west-1.pooler.supabase.com}:5432/postgres?sslmode=require}}"
    driver-class-name: org.postgresql.Driver
    username: "${DB_USERNAME:${SUPABASE_DB_USERNAME:postgres.${SUPABASE_PROJECT_REF:dsexqqtwerhhilfkjkyn}}}"
    password: '${DB_PASSWORD:${SUPABASE_DB_PASSWORD:#T3ch!012345%hdc}}'
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 600000
      pool-name: SupabaseHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

logging:
  level:
    root: INFO
    com.hashtech.govaccessai: DEBUG
    org.hibernate.SQL: INFO